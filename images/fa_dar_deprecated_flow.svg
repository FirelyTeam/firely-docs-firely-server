<svg xmlns="http://www.w3.org/2000/svg" width="910" height="684" viewBox="0 0 910 684" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="910" height="684" fill="#fff"/><line x1="110" y1="74" x2="110" y2="620" stroke="#999" stroke-dasharray="3,3"/><rect x="35" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="110" y="40.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">User</text><text x="110" y="54.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">(browser)</text><rect x="35" y="620" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="110" y="640.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">User</text><text x="110" y="654.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">(browser)</text><line x1="340" y1="74" x2="340" y2="620" stroke="#999" stroke-dasharray="3,3"/><rect x="265" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="340" y="47.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Client app</text><rect x="265" y="620" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="340" y="647.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Client app</text><line x1="570" y1="74" x2="570" y2="620" stroke="#999" stroke-dasharray="3,3"/><rect x="495" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="570" y="47.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Auth</text><rect x="495" y="620" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="570" y="647.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Auth</text><line x1="800" y1="74" x2="800" y2="620" stroke="#999" stroke-dasharray="3,3"/><rect x="725" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="800" y="40.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Server</text><text x="800" y="54.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">+ plugin</text><rect x="725" y="620" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="800" y="640.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Server</text><text x="800" y="654.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">+ plugin</text><rect x="10" y="116" width="890" height="22" fill="#e8eef7" rx="3"/><text x="20" y="131" font-size="12" font-weight="bold" fill="#1f3b63">Sign-in of a Patient account</text><line x1="340" y1="180" x2="562" y2="180" stroke="#333" stroke-width="1.4"/><polygon points="570,180 562,176 562,184" fill="#333"/><text x="346" y="174" font-size="11.5" text-anchor="start" fill="#222">1. Authorize request (through the browser)</text><line x1="110" y1="214" x2="562" y2="214" stroke="#333" stroke-width="1.4"/><polygon points="570,214 562,210 562,218" fill="#333"/><text x="340.0" y="208" font-size="11.5" text-anchor="middle" fill="#222">2. Sign in (password or identity provider)</text><line x1="570" y1="248" x2="792" y2="248" stroke="#333" stroke-width="1.4"/><polygon points="800,248 792,244 792,252" fill="#333"/><text x="576" y="242" font-size="11.5" text-anchor="start" fill="#222">3. POST $check-authorized-representative-relationships</text><rect x="549.2" y="260" width="350.8" height="22" fill="#fff8dc" stroke="#c9b458" rx="2"/><text x="557.2" y="275" font-size="11.5" fill="#222">patient = the user&#x27;s own fhirUser, such as Patient/123</text><line x1="800" y1="310" x2="578" y2="310" stroke="#333" stroke-width="1.4"/><polygon points="570,310 578,306 578,314" fill="#333"/><text x="576" y="304" font-size="11.5" text-anchor="start" fill="#222">4. POST /api/external/authorized-representative</text><line x1="800" y1="344" x2="578" y2="344" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="570,344 578,340 578,348" fill="#333"/><text x="685.0" y="338" font-size="11.5" text-anchor="middle" fill="#222">5. result = true / false</text><line x1="570" y1="378" x2="118" y2="378" stroke="#333" stroke-width="1.4"/><polygon points="110,378 118,374 118,382" fill="#333"/><text x="340.0" y="372" font-size="11.5" text-anchor="middle" fill="#222">6. Selection page (only when result = true)</text><line x1="110" y1="412" x2="562" y2="412" stroke="#333" stroke-width="1.4"/><polygon points="570,412 562,408 562,416" fill="#333"/><text x="340.0" y="406" font-size="11.5" text-anchor="middle" fill="#222">7. Choose: yourself or a patient</text><line x1="570" y1="446" x2="348" y2="446" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="340,446 348,442 348,450" fill="#333"/><text x="346" y="440" font-size="11.5" text-anchor="start" fill="#222">8. Code, then token: fhirUser = own Patient, patient = choice</text><rect x="10" y="468" width="890" height="22" fill="#e8eef7" rx="3"/><text x="20" y="483" font-size="12" font-weight="bold" fill="#1f3b63">Using and refreshing the token</text><line x1="340" y1="532" x2="792" y2="532" stroke="#333" stroke-width="1.4"/><polygon points="800,532 792,528 792,536" fill="#333"/><text x="570.0" y="526" font-size="11.5" text-anchor="middle" fill="#222">9. FHIR requests for the chosen patient</text><line x1="340" y1="566" x2="562" y2="566" stroke="#333" stroke-width="1.4"/><polygon points="570,566 562,562 562,570" fill="#333"/><text x="455.0" y="560" font-size="11.5" text-anchor="middle" fill="#222">10. Refresh token request</text><line x1="570" y1="600" x2="348" y2="600" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="340,600 348,596 348,604" fill="#333"/><text x="346" y="594" font-size="11.5" text-anchor="start" fill="#222">11. New access token for the same patient, without a call to Firely Server</text></svg>