<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1122" viewBox="0 0 1170 1122" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1170" height="1122" fill="#fff"/><line x1="110" y1="74" x2="110" y2="1058" stroke="#999" stroke-dasharray="3,3"/><rect x="35" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="110" y="40.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Onboarding app</text><text x="110" y="54.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">or admin</text><rect x="35" y="1058" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="110" y="1078.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Onboarding app</text><text x="110" y="1092.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">or admin</text><line x1="300" y1="74" x2="300" y2="1058" stroke="#999" stroke-dasharray="3,3"/><rect x="225" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="300" y="40.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">User</text><text x="300" y="54.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">(browser)</text><rect x="225" y="1058" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="300" y="1078.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">User</text><text x="300" y="1092.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">(browser)</text><line x1="490" y1="74" x2="490" y2="1058" stroke="#999" stroke-dasharray="3,3"/><rect x="415" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="490" y="47.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Client app</text><rect x="415" y="1058" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="490" y="1085.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Client app</text><line x1="680" y1="74" x2="680" y2="1058" stroke="#999" stroke-dasharray="3,3"/><rect x="605" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="680" y="47.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Auth</text><rect x="605" y="1058" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="680" y="1085.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Auth</text><line x1="870" y1="74" x2="870" y2="1058" stroke="#999" stroke-dasharray="3,3"/><rect x="795" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="870" y="40.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Identity</text><text x="870" y="54.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">provider</text><rect x="795" y="1058" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="870" y="1078.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Identity</text><text x="870" y="1092.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">provider</text><line x1="1060" y1="74" x2="1060" y2="1058" stroke="#999" stroke-dasharray="3,3"/><rect x="985" y="20" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="1060" y="40.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Server</text><text x="1060" y="54.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">+ plugin</text><rect x="985" y="1058" width="150" height="46" fill="#f4f6f9" stroke="#556" rx="4"/><text x="1060" y="1078.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">Firely Server</text><text x="1060" y="1092.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#222">+ plugin</text><rect x="10" y="116" width="1150" height="22" fill="#e8eef7" rx="3"/><text x="20" y="131" font-size="12" font-weight="bold" fill="#1f3b63">A. Onboarding (once per representative)</text><line x1="110" y1="180" x2="672" y2="180" stroke="#333" stroke-width="1.4"/><polygon points="680,180 672,176 672,184" fill="#333"/><text x="395.0" y="174" font-size="11.5" text-anchor="middle" fill="#222">1. POST /api/external/representative</text><line x1="680" y1="214" x2="118" y2="214" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="110,214 118,210 118,218" fill="#333"/><text x="395.0" y="208" font-size="11.5" text-anchor="middle" fill="#222">user id and sub identifier</text><line x1="110" y1="248" x2="1052" y2="248" stroke="#333" stroke-width="1.4"/><polygon points="1060,248 1052,244 1052,252" fill="#333"/><text x="585.0" y="242" font-size="11.5" text-anchor="middle" fill="#222">2. RelatedPerson with identifier sub|&lt;user id&gt; (+ Consent)</text><rect x="467.4" y="260" width="425.2" height="22" fill="#fff8dc" stroke="#c9b458" rx="2"/><text x="475.4" y="275" font-size="11.5" fill="#222">or: admin uses &#x27;link representee&#x27;, Firely Auth adds the identifier</text><line x1="680" y1="310" x2="308" y2="310" stroke="#333" stroke-width="1.4"/><polygon points="300,310 308,306 308,314" fill="#333"/><text x="490.0" y="304" font-size="11.5" text-anchor="middle" fill="#222">3. Invitation email</text><rect x="10" y="332" width="1150" height="22" fill="#e8eef7" rx="3"/><text x="20" y="347" font-size="12" font-weight="bold" fill="#1f3b63">B. Sign-in</text><line x1="490" y1="396" x2="672" y2="396" stroke="#333" stroke-width="1.4"/><polygon points="680,396 672,392 672,400" fill="#333"/><text x="496" y="390" font-size="11.5" text-anchor="start" fill="#222">4. Authorize request (through the browser)</text><line x1="680" y1="430" x2="862" y2="430" stroke="#333" stroke-width="1.4"/><polygon points="870,430 862,426 862,434" fill="#333"/><text x="686" y="424" font-size="11.5" text-anchor="start" fill="#222">5. Sign in at the identity provider</text><line x1="870" y1="464" x2="688" y2="464" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="680,464 688,460 688,468" fill="#333"/><text x="775.0" y="458" font-size="11.5" text-anchor="middle" fill="#222">user authenticated</text><line x1="680" y1="498" x2="1052" y2="498" stroke="#333" stroke-width="1.4"/><polygon points="1060,498 1052,494 1052,502" fill="#333"/><text x="870.0" y="492" font-size="11.5" text-anchor="middle" fill="#222">6. POST $representative-relationships (token with sub)</text><rect x="710.0" y="510" width="450.0" height="22" fill="#fff8dc" stroke="#c9b458" rx="2"/><text x="718.0" y="525" font-size="11.5" fill="#222">7. Find RelatedPersons with the sub identifier that are authorized now</text><line x1="1060" y1="560" x2="688" y2="560" stroke="#333" stroke-width="1.4"/><polygon points="680,560 688,556 688,564" fill="#333"/><text x="870.0" y="554" font-size="11.5" text-anchor="middle" fill="#222">8. POST /api/external/representative-relationships</text><line x1="1060" y1="594" x2="688" y2="594" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="680,594 688,590 688,598" fill="#333"/><text x="870.0" y="588" font-size="11.5" text-anchor="middle" fill="#222">9. result = true / false</text><line x1="680" y1="628" x2="308" y2="628" stroke="#333" stroke-width="1.4"/><polygon points="300,628 308,624 308,632" fill="#333"/><text x="490.0" y="622" font-size="11.5" text-anchor="middle" fill="#222">10. Selection page</text><line x1="300" y1="662" x2="672" y2="662" stroke="#333" stroke-width="1.4"/><polygon points="680,662 672,658 672,666" fill="#333"/><text x="490.0" y="656" font-size="11.5" text-anchor="middle" fill="#222">11. Choose a patient</text><line x1="680" y1="696" x2="1052" y2="696" stroke="#333" stroke-width="1.4"/><polygon points="1060,696 1052,692 1052,700" fill="#333"/><text x="870.0" y="690" font-size="11.5" text-anchor="middle" fill="#222">12. POST Patient/$check-authorized-representative</text><line x1="1060" y1="730" x2="688" y2="730" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="680,730 688,726 688,734" fill="#333"/><text x="870.0" y="724" font-size="11.5" text-anchor="middle" fill="#222">13. result (+ consent)</text><line x1="680" y1="764" x2="498" y2="764" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="490,764 498,760 498,768" fill="#333"/><text x="496" y="758" font-size="11.5" text-anchor="start" fill="#222">14. Code, then token: fhirUser = RelatedPerson, patient = choice</text><rect x="10" y="786" width="1150" height="22" fill="#e8eef7" rx="3"/><text x="20" y="801" font-size="12" font-weight="bold" fill="#1f3b63">C. Using the token</text><line x1="490" y1="850" x2="1052" y2="850" stroke="#333" stroke-width="1.4"/><polygon points="1060,850 1052,846 1052,854" fill="#333"/><text x="775.0" y="844" font-size="11.5" text-anchor="middle" fill="#222">15. FHIR requests, limited to the patient&#x27;s compartment</text><rect x="10" y="872" width="1150" height="22" fill="#e8eef7" rx="3"/><text x="20" y="887" font-size="12" font-weight="bold" fill="#1f3b63">D. Refresh</text><line x1="490" y1="936" x2="672" y2="936" stroke="#333" stroke-width="1.4"/><polygon points="680,936 672,932 672,940" fill="#333"/><text x="585.0" y="930" font-size="11.5" text-anchor="middle" fill="#222">16. Refresh token request</text><line x1="680" y1="970" x2="1052" y2="970" stroke="#333" stroke-width="1.4"/><polygon points="1060,970 1052,966 1052,974" fill="#333"/><text x="870.0" y="964" font-size="11.5" text-anchor="middle" fill="#222">17. POST Patient/$check-authorized-representative</text><line x1="1060" y1="1004" x2="688" y2="1004" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="680,1004 688,1000 688,1008" fill="#333"/><text x="870.0" y="998" font-size="11.5" text-anchor="middle" fill="#222">result</text><line x1="680" y1="1038" x2="498" y2="1038" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="490,1038 498,1034 498,1042" fill="#333"/><text x="496" y="1032" font-size="11.5" text-anchor="start" fill="#222">18. New access token, or invalid_grant</text></svg>